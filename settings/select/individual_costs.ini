[Primer3Penalties]
file = table.candidate_primers.csv
column = pair_penalty
weight = 1.0

[MisprimingSites]
file = blast/table.blast.candidate_primers.summary.csv
column = predicted_bound
weight = 1.0

# malariagen-data SNP cost: 3'-end alt-allele frequency in cohort.
# Most-impactful PCR-failure feature; weighted heavily.
[Worst3PrimeAF]
file = snpcheck/table.candidate_primers.snp_counts.csv
column = worst_3prime_af
weight = 5.0

# Span-wide alt-allele frequency: penalises any primer-binding SNP.
[MaxAltAF]
file = snpcheck/table.candidate_primers.snp_counts.csv
column = max_alt_af
weight = 1.0

# Count of segregating sites in 3' end window.
[Snps3Prime]
file = snpcheck/table.candidate_primers.snp_counts.csv
column = n_snps_3prime
weight = 2.0
